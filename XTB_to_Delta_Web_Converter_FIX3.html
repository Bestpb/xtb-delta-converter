<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XTB → Delta FIX3</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Arial;background:#111827;color:#fff;padding:20px}
.box{max-width:900px;margin:auto;background:#1f2937;padding:20px;border-radius:16px}
button{padding:14px;border:0;border-radius:12px;background:#7c3aed;color:white;font-weight:bold;width:100%;margin-top:12px}
input{width:100%;padding:12px}
pre{background:#000;padding:12px;border-radius:10px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
<h1>XTB → Delta FIX3</h1>
<input type="file" id="f" accept=".xlsx,.xls">
<button onclick="go()">Převést</button>
<pre id="log"></pre>
</div>

<script>
const H=["Date","Way","Base amount","Base currency (name)","Base type","Quote amount","Quote currency","Exchange","Sent/Received","Sent to","Fee amount","Fee currency","Broker","Notes"];

function l(t){document.getElementById("log").textContent+=t+"\\n";}

async function go(){
document.getElementById("log").textContent="";
const f=document.getElementById("f").files[0];
if(!f){alert("Vyber XLSX");return;}

const data=await f.arrayBuffer();
const wb=XLSX.read(data,{type:"array"});
let out=[];

wb.SheetNames.forEach(name=>{
const ws=wb.Sheets[name];
fix(ws);

const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
l(name+": "+arr.length+" řádků");

for(let i=0;i<arr.length;i++){

const row=arr[i].map(v=>String(v||""));

const joined=row.join(" | ").toUpperCase();

if(joined.includes("OPEN BUY") || joined.includes("OPEN SELL")){

let side=joined.includes("OPEN BUY")?"BUY":"SELL";

let ticker="";
for(let c of row){
if(String(c).includes(".US") || String(c).includes(".DE") || String(c).includes(".UK")){
ticker=String(c).trim().toUpperCase();
}
}

if(!ticker) continue;

ticker=ticker.replace("GOOGC.US","GOOGL");
ticker=ticker.replace("GOOGL.US","GOOGL");
ticker=ticker.replace("GOOG.US","GOOGL");
ticker=ticker.replace("TSLA.US","TSLA");

if(ticker.endsWith(".US")) ticker=ticker.replace(".US","");
if(ticker.endsWith(".DE")) ticker=ticker.replace(".DE","");
if(ticker.endsWith(".UK")) ticker=ticker.replace(".UK","");

const m=joined.match(/OPEN\s+(BUY|SELL)\s+([0-9.]+)/i);
if(!m) continue;

const qty=parseFloat(m[2]);

let amount=0;
for(let c of row){
let s=String(c).replace(",",".");
if(/^-?\d+(\.\d+)?$/.test(s)){
let n=parseFloat(s);
if(Math.abs(n)>amount) amount=Math.abs(n);
}
}

let date="";
for(let c of row){
let s=String(c);
let d=new Date(s);
if(!isNaN(d)){
date=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
break;
}
}

if(!date) continue;

out.push([
date,
side,
fmtQty(qty,ticker),
ticker,
isETF(ticker)?"FUND":"STOCK",
amount.toFixed(2),
ticker==="VUAA"||ticker==="EUNL"?"EUR":"USD",
ticker==="VUAA"||ticker==="EUNL"?"Xetra":"Nasdaq",
"",
"",
"",
"",
"XTB",
""
]);

}

}
});

if(!out.length){
alert("Pořád nenalezeny žádné řádky.");
return;
}

const csv=[H,...out].map(r=>r.map(esc).join(",")).join("\\r\\n");

const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="DELTA_IMPORT.csv";
a.click();

l("Exportováno: "+out.length);
}

function fix(ws){
const keys=Object.keys(ws).filter(k=>k[0]!="!");
if(!keys.length)return;
let r=XLSX.utils.decode_range(keys[0]);
keys.forEach(k=>{
const c=XLSX.utils.decode_cell(k);
r.s.r=Math.min(r.s.r,c.r);
r.s.c=Math.min(r.s.c,c.c);
r.e.r=Math.max(r.e.r,c.r);
r.e.c=Math.max(r.e.c,c.c);
});
ws["!ref"]=XLSX.utils.encode_range(r);
}

function esc(v){
const s=String(v??"");
if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
return s;
}

function fmtQty(n,t){
if(t==="TSLA") return n.toFixed(3).replace(/\.?0+$/,"");
return n.toFixed(8).replace(/\.?0+$/,"");
}

function pad(n){return String(n).padStart(2,"0")}

function isETF(t){
return ["VUAA","EUNL","IS3N","SXRV","IB1T","SEC0","VWCE","SXR8"].includes(t);
}
</script>
</body>
</html>
