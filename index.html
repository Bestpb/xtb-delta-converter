<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XTB → Delta XML FIX4</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#111827;color:white;padding:20px;margin:0}
.box{max-width:900px;margin:auto;background:#1f2937;padding:20px;border-radius:16px}
button{padding:14px;border:0;border-radius:12px;background:#7c3aed;color:white;font-weight:bold;width:100%;margin-top:12px;font-size:16px}
input{width:100%;padding:12px;background:#111827;border:1px dashed #64748b;border-radius:12px;color:white}
pre{background:#000;padding:12px;border-radius:10px;overflow:auto;white-space:pre-wrap}
.ok{color:#22c55e}.err{color:#ef4444}
</style>
</head>
<body>
<div class="box">
<h1>XTB → Delta XML FIX4</h1>
<p>Čte XTB XLSX přímo jako ZIP/XML. Vhodné pro iPad/Safari/GitHub Pages.</p>
<input type="file" id="f" accept=".xlsx,.xls">
<button onclick="go()">Převést na Delta CSV</button>
<pre id="log">Čekám na soubor…</pre>
</div>

<script>
const HEAD=["Date","Way","Base amount","Base currency (name)","Base type","Quote amount","Quote currency","Exchange","Sent/Received","Sent to","Fee amount","Fee currency","Broker","Notes"];

function write(t){document.getElementById("log").textContent=t;}
function append(t){document.getElementById("log").textContent+="\n"+t;}

async function go(){
  try{
    write("Zpracovávám XLSX jako ZIP/XML…");
    const file=document.getElementById("f").files[0];
    if(!file){alert("Vyber XLSX soubor");return;}
    const zip=await JSZip.loadAsync(await file.arrayBuffer());

    const shared=await loadSharedStrings(zip);
    append("Shared strings: "+shared.length);

    let all=[];
    const sheetNames=Object.keys(zip.files).filter(n=>n.match(/^xl\/worksheets\/sheet\d+\.xml$/));
    append("Listy: "+sheetNames.join(", "));

    for(const s of sheetNames){
      const xml=await zip.file(s).async("string");
      const rows=parseSheet(xml, shared);
      append(s+": "+rows.length+" řádků");
      all=all.concat(parseRows(rows));
    }

    all=dedupe(all);
    if(!all.length){
      write("Nenalezeny žádné řádky k převodu.\nZnamená to, že v exportu nejsou řádky typu Stock purchase / OPEN BUY nebo OPEN SELL.");
      return;
    }

    const csv=toCsv([HEAD,...all.map(r=>HEAD.map(h=>r[h]||""))]);
    const base=file.name.replace(/\.[^.]+$/,"");
    const stamp=new Date().toISOString().replace(/[-:T]/g,"").slice(0,14);
    download(csv,base+"_DELTA_IMPORT_"+stamp+".csv");

    write("HOTOVO – CSV staženo.\nExportováno řádků: "+all.length+"\nFormát: UTF-8 bez BOM, 14 sloupců, CRLF.\n\nPrvní řádky:\n"+all.slice(0,10).map(r=>JSON.stringify(r)).join("\n"));
  }catch(e){
    write("CHYBA: "+e.message);
    console.error(e);
  }
}

async function loadSharedStrings(zip){
  const f=zip.file("xl/sharedStrings.xml");
  if(!f)return [];
  const xml=await f.async("string");
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const sis=[...doc.getElementsByTagNameNS("*","si")];
  return sis.map(si=>[...si.getElementsByTagNameNS("*","t")].map(t=>t.textContent||"").join(""));
}

function parseSheet(xml, shared){
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const rowEls=[...doc.getElementsByTagNameNS("*","row")];
  const rows=[];
  for(const rowEl of rowEls){
    const obj={};
    const cells=[...rowEl.getElementsByTagNameNS("*","c")];
    for(const c of cells){
      const ref=c.getAttribute("r")||"";
      const col=ref.replace(/[0-9]/g,"");
      const type=c.getAttribute("t")||"";
      const vEl=c.getElementsByTagNameNS("*","v")[0];
      let val=vEl ? vEl.textContent : "";
      if(type==="s") val=shared[Number(val)] || "";
      obj[col]=val;
    }
    rows.push(obj);
  }
  return rows;
}

function parseRows(rows){
  let out=[];
  for(const r of rows){
    const type=String(r["A"]||"").trim();
    const tickerRaw=String(r["B"]||"").trim();
    const time=r["D"];
    const amount=r["E"];
    const comment=String(r["G"]||"").trim();

    // XTB nový export: Cash Operations / Stock purchase
    if(type==="Stock purchase" || type==="Stock sale"){
      const m=comment.match(/OPEN\s+(BUY|SELL)\s+([0-9.]+)\s+@\s+([0-9.]+)/i);
      if(!m || !tickerRaw) continue;
      const way=m[1].toUpperCase();
      const qty=Number(m[2]);
      const ticker=mapTicker(tickerRaw);
      out.push(deltaRow({
        date: excelDate(time),
        way,
        qty: formatQty(qty,ticker),
        ticker,
        baseType: isETF(ticker)?"FUND":"STOCK",
        quoteAmount: money(Math.abs(Number(amount)||0)),
        quoteCurrency: inferCurrency(tickerRaw),
        exchange: inferExchange(tickerRaw)
      }));
    }

    // cash operations
    if(type.toUpperCase().includes("DEPOSIT") || type.toUpperCase().includes("WITHDRAW")){
      const way=type.toUpperCase().includes("DEPOSIT") ? "DEPOSIT" : "WITHDRAW";
      const cur=inferCurrencyFromText(comment) || inferCurrency(tickerRaw) || "";
      out.push({
        "Date": excelDate(time),
        "Way": way,
        "Base amount": "",
        "Base currency (name)": cur,
        "Base type": "",
        "Quote amount": "",
        "Quote currency": "",
        "Exchange": "",
        "Sent/Received": "",
        "Sent to": "",
        "Fee amount": "",
        "Fee currency": "",
        "Broker": "XTB",
        "Notes": ""
      });
    }
  }
  return out.filter(r=>r["Date"] && r["Way"]);
}

function deltaRow(x){
  return {
    "Date": x.date,
    "Way": x.way,
    "Base amount": x.qty,
    "Base currency (name)": x.ticker,
    "Base type": x.baseType,
    "Quote amount": x.quoteAmount,
    "Quote currency": x.quoteCurrency,
    "Exchange": x.exchange,
    "Sent/Received": "",
    "Sent to": "",
    "Fee amount": "",
    "Fee currency": "",
    "Broker": "XTB",
    "Notes": ""
  };
}

function mapTicker(t){
  t=String(t||"").trim().toUpperCase();

  const map={
    "GOOGC.US":"GOOGL",
    "GOOG.US":"GOOGL",
    "GOOGL.US":"GOOGL",

    "TSLA.US":"TSLA",
    "AAPL.US":"AAPL",
    "MSFT.US":"MSFT",

    "SMSN.UK":"SMSN.L",

    "VUAA.DE":"VUAA",
    "EUNL.DE":"EUNL",
    "IS3N.DE":"IS3N",
    "SXRV.DE":"SXRV",
    "IB1T.DE":"IB1T",
    "SEC0.DE":"SEC0",
    "AIR.DE":"AIR"
  };

  if(map[t]) return map[t];

  if(t.endsWith(".US")) return t.slice(0,-3);

  if(t.endsWith(".DE")) return t.slice(0,-3);

  return t;
}

function isETF(t){return ["VUAA","EUNL","IS3N","SXRV","IB1T","SEC0","VWCE","SXR8","CSPX","IWDA","EIMI"].includes(t);}
function inferCurrency(t){t=String(t||"").toUpperCase(); if(t.endsWith(".DE"))return"EUR"; if(t.endsWith(".US")||t.endsWith(".UK"))return"USD"; return "";}
function inferExchange(t){t=String(t||"").toUpperCase(); if(t.endsWith(".DE"))return"Xetra"; if(t.endsWith(".US"))return"Nasdaq"; if(t.endsWith(".UK"))return"London"; return "";}
function inferCurrencyFromText(t){t=String(t||"").toUpperCase(); if(t.includes("USD"))return"USD"; if(t.includes("EUR"))return"EUR"; if(t.includes("CZK"))return"CZK"; return "";}
function money(n){return Math.abs(Number(n)||0).toFixed(2);}
function formatQty(n,ticker){n=Math.abs(Number(n)||0); return (ticker==="TSLA" ? n.toFixed(3) : n.toFixed(8)).replace(/\.?0+$/,"");}

function excelDate(v){
  const n=Number(v);
  if(!isNaN(n) && n>20000){
    const ms=(n-25569)*86400*1000;
    const d=new Date(ms);
    return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
  }
  const d=new Date(v);
  if(!isNaN(d)) return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  return "";
}
function pad(n){return String(n).padStart(2,"0");}

function dedupe(rows){
  const seen=new Set(), out=[];
  for(const r of rows){
    const k=HEAD.map(h=>r[h]||"").join("|");
    if(!seen.has(k)){seen.add(k);out.push(r);}
  }
  return out;
}

function esc(v){
  const s=String(v??"");
  if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function toCsv(rows){return rows.map(r=>r.map(esc).join(",")).join("\r\n")+"\r\n";}
function download(text,name){
  const blob=new Blob([text],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
</script>
</body>
</html>
